    <g transform="translate(608 100)">
      <rect width="122" height="98" rx="12" fill="#141C27" stroke="#273345"/>
      <text x="14" y="18" fill="#5B8CFF" font-size="9" font-weight="700" letter-spacing="1.4">05</text>
      <text x="14" y="52" fill="#E5E7EB" font-size="14" font-weight="650">Layout</text>
      <text x="14" y="76" fill="#7C889B" font-size="9">DocLayout</text>
