    <g transform="translate(336 100)">
      <rect width="122" height="98" rx="12" fill="#141C27" stroke="#273345"/>
      <text x="14" y="18" fill="#5B8CFF" font-size="9" font-weight="700" letter-spacing="1.4">03</text>
