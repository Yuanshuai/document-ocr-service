      <text x="14" y="18" fill="#5B8CFF" font-size="9" font-weight="700" letter-spacing="1.4">06</text>
      <text x="14" y="52" fill="#E5E7EB" font-size="14" font-weight="650">Tables</text>
      <text x="14" y="76" fill="#7C889B" font-size="9">RT-DETR</text>
